name: "Stevedore Release"
description: "Build, scan, sign, and release Docker/OCI images with stevedore — installs every tool it needs."
author: "blairham"
branding:
  icon: "anchor"
  color: "blue"

inputs:
  command:
    description: "stevedore subcommand to run (release, merge, publish, plan, build, check, verify, doctor)."
    required: false
    default: "release"
  args:
    description: "Additional arguments appended to the command, e.g. '--snapshot --only-changed'."
    required: false
    default: ""
  config:
    description: "Path to the stevedore config file (passed as -f). Autodiscovered when empty."
    required: false
    default: ""
  version:
    description: "stevedore release to download (a tag like v0.0.0, or 'latest')."
    required: false
    default: "latest"
  install-stevedore:
    description: "Download the stevedore release binary. Set false if it's already on PATH."
    required: false
    default: "true"
  working-directory:
    description: "Directory to run stevedore in."
    required: false
    default: "."
  setup-buildx:
    description: "Set up docker buildx. Disable if a previous step already did."
    required: false
    default: "true"
  install-cosign:
    description: "Install cosign (needed when sign.cosign.enabled)."
    required: false
    default: "true"
  install-syft:
    description: "Install syft (needed when sbom.enabled)."
    required: false
    default: "true"
  install-grype:
    description: "Install grype (needed when scan.enabled with scanner: grype)."
    required: false
    default: "true"
  install-crane:
    description: "Install crane (needed when versioning.strategy: registry)."
    required: false
    default: "false"

outputs:
  plan:
    description: "The JSON build plan emitted by `command: plan` (matrix mode); empty for other commands."
    value: ${{ steps.run.outputs.plan }}
  only:
    description: "`command: plan` only: every planned image id, comma-joined — the `--only` of a final `publish` or `merge` step."
    value: ${{ steps.run.outputs.only }}
  pins:
    description: "`command: plan` only: every planned image's `--pin-version id=ver`, space-joined, to go with `only`."
    value: ${{ steps.run.outputs.pins }}
  refs:
    description: "`command: release`/`merge`: JSON object of image id → `repository@sha256:…` (its first repository) for every image whose digest was published this run or already released from this commit — `fromJSON(steps.<id>.outputs.refs).api`."
    value: ${{ steps.run.outputs.refs }}
  digests:
    description: "As `refs`, but image id → `sha256:…` digest."
    value: ${{ steps.run.outputs.digests }}
  ref:
    description: "The one pinned image's `repository@sha256:…`, set only when exactly one image was pinned (a single-image repo needs no fromJSON)."
    value: ${{ steps.run.outputs.ref }}
  digest:
    description: "The one pinned image's `sha256:…` digest, set only when exactly one image was pinned."
    value: ${{ steps.run.outputs.digest }}
  summary:
    description: "Compact JSON release summary ({project, images: [{id, version, digest, repositories, pushed, skipped, reason, …}]}) written by `command: release`/`build`; empty for other commands. Filter on `pushed` before notifying downstream systems."
    value: ${{ steps.run.outputs.summary }}

runs:
  using: "composite"
  steps:
    # cosign comes first: the stevedore download is verified with it, so it is
    # installed whenever the action installs stevedore, even with
    # install-cosign: false.
    - name: Install cosign
      if: ${{ inputs.install-cosign == 'true' || inputs.install-stevedore == 'true' }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Install stevedore
      if: ${{ inputs.install-stevedore == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SD_VERSION: ${{ inputs.version }}
        SD_ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        repo=blairham/stevedore
        os=$(uname -s)          # Linux | Darwin (matches the release asset naming)
        arch=$(uname -m)        # x86_64 | aarch64 | arm64
        case "$arch" in aarch64) arch=arm64 ;; esac
        tag=""
        if [ "$SD_VERSION" != "latest" ]; then
          tag="$SD_VERSION"
        elif [[ "${SD_ACTION_REF:-}" =~ ^v([0-9]+)($|\.) ]]; then
          # `uses: …@v1` must not start pulling v2 binaries the day v2 ships:
          # the action and the binary it drives are one contract. Resolve
          # "latest" inside the action's own major line, falling back to the
          # newest release overall when that lookup finds nothing.
          tag=$(gh release list --repo "$repo" --limit 100 \
                  --exclude-drafts --exclude-pre-releases --json tagName \
                  --jq "[.[].tagName | select(startswith(\"v${BASH_REMATCH[1]}.\"))] | first // empty" \
                2>/dev/null || true)
        fi
        # The signature check below pins the tag in the signer's identity, so
        # "newest" is resolved to a name first rather than left to `gh`.
        if [ -z "$tag" ]; then
          tag=$(gh release view --repo "$repo" --json tagName --jq .tagName)
        fi
        dest="${RUNNER_TEMP:-/tmp}/stevedore-bin"
        rm -rf "$dest"
        mkdir -p "$dest"
        cd "$dest"
        archive="stevedore_${tag#v}_${os}_${arch}.tar.gz"
        gh release download "$tag" --repo "$repo" \
          --pattern "$archive" --pattern checksums.txt --pattern checksums.txt.sigstore.json
        for f in "$archive" checksums.txt checksums.txt.sigstore.json; do
          if [ ! -s "$f" ]; then
            echo "::error::release $tag has no $f; the action only installs releases with a signed checksums.txt (v1.0.2 and later)"
            exit 1
          fi
        done

        # 1. checksums.txt was signed by this repository's release workflow,
        #    for this tag. A release re-run by hand is signed from the branch
        #    it was dispatched from, so main is accepted too (see SECURITY.md).
        tag_re=$(printf '%s' "$tag" | sed 's/[][\.*^$+?(){}|/]/\\&/g')
        cosign verify-blob \
          --certificate-identity-regexp "^https://github\\.com/blairham/stevedore/\\.github/workflows/release\\.yml@refs/(tags/${tag_re}|heads/main)\$" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          --bundle checksums.txt.sigstore.json checksums.txt

        # 2. The archive is the one checksums.txt lists. Exactly one line must
        #    name it: `--ignore-missing` would pass an archive it never saw.
        want=$(awk -v n="$archive" '$2 == n || $2 == "*" n { print $1 }' checksums.txt)
        if [ "$(printf '%s\n' "$want" | grep -c .)" -ne 1 ]; then
          echo "::error::checksums.txt does not list $archive exactly once"
          exit 1
        fi
        if command -v sha256sum >/dev/null; then
          got=$(sha256sum "$archive" | cut -d' ' -f1)
        else
          got=$(shasum -a 256 "$archive" | cut -d' ' -f1)
        fi
        if [ "$got" != "$want" ]; then
          echo "::error::$archive sha256 $got does not match checksums.txt ($want)"
          exit 1
        fi
        echo "verified $archive ($got) against the signed checksums.txt of $tag"

        tar -xzf "$archive" stevedore
        chmod +x stevedore
        echo "$dest" >> "$GITHUB_PATH"
        ./stevedore --version

    - name: Set up buildx
      if: ${{ inputs.setup-buildx == 'true' }}
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Install syft
      if: ${{ inputs.install-syft == 'true' }}
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

    # Through anchore's own pinned action rather than `curl … | sh` of the
    # install script on grype's `main`, which ran whatever that branch held on
    # the day — inside a workflow that holds signing and push credentials.
    - name: Install grype
      id: grype
      if: ${{ inputs.install-grype == 'true' }}
      uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

    # download-grype reports where it put the binary but does not add it to
    # PATH, and stevedore finds its tools on PATH.
    - name: Put grype on PATH
      if: ${{ inputs.install-grype == 'true' }}
      shell: bash
      env:
        GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
      run: |
        echo "$(dirname "$GRYPE_CMD")" >> "$GITHUB_PATH"
        "$GRYPE_CMD" version

    - name: Set up Go (for crane)
      if: ${{ inputs.install-crane == 'true' }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "stable"

    - name: Install crane
      if: ${{ inputs.install-crane == 'true' }}
      shell: bash
      run: |
        go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Preflight
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      continue-on-error: true
      run: stevedore doctor || true

    - name: Run stevedore
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SD_COMMAND: ${{ inputs.command }}
        SD_ARGS: ${{ inputs.args }}
        SD_CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        cmd=(stevedore "$SD_COMMAND")
        if [ -n "$SD_CONFIG" ]; then cmd+=(-f "$SD_CONFIG"); fi
        # Word-split SD_ARGS intentionally so callers can pass multiple flags.
        # shellcheck disable=SC2206
        if [ -n "$SD_ARGS" ]; then cmd+=($SD_ARGS); fi
        echo "+ ${cmd[*]}"
        if [ "$SD_COMMAND" = "plan" ]; then
          # plan prints one compact JSON line on stdout (progress on stderr);
          # expose it as the `plan` output for a matrix fan-out.
          out="${RUNNER_TEMP:-/tmp}/stevedore-plan.json"
          "${cmd[@]}" | tee "$out"
          echo "plan=$(cat "$out")" >> "$GITHUB_OUTPUT"
        else
          "${cmd[@]}"
        fi

name: release

# On a version tag: stevedore releases its own multi-arch image (signed + SBOM +
# provenance) by dogfooding itself, while GoReleaser publishes the CLI binary,
# the GitHub release, and the Homebrew formula. Two tools, two artifact kinds.
on:
  push:
    tags: ["v*"]
  # Re-run a release for a tag that already exists — after a failed publish,
  # say — without moving or re-creating the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.2). Must already exist."
        required: true
        type: string

# Read-only by default; each job asks for exactly what it writes.
permissions:
  contents: read

jobs:
  # A release that publishes before its tests run ships whatever the tag points
  # at. Both artifact jobs wait on this one.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go test -race ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # tags + history for versioning and changelog

      # The toolchain go.mod pins, not "stable": the released binary must be
      # the one CI tested, not whatever Go shipped this morning.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # Pinned action, not `curl … | sh` of grype's `main` — this job holds
      # push and signing credentials.
      - name: Install grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      - name: Put grype on PATH
        env:
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        run: |
          echo "$(dirname "$GRYPE_CMD")" >> "$GITHUB_PATH"
          "$GRYPE_CMD" version

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build stevedore
        run: go build -o /usr/local/bin/stevedore .

      - name: Release image (dogfood)
        run: stevedore release

  # GoReleaser publishes the CLI binary, checksums, the GitHub release, and the
  # Homebrew formula (to blairham/homebrew-tap).
  binary:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release and its assets
      # Keyless cosign over checksums.txt and the provenance attestation both
      # sign with the workflow's OIDC identity — see `signs` in .goreleaser.yaml.
      id-token: write
      attestations: write # store the provenance in the repository's attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false # replaced by the release-scoped cache below
      # Release-scoped Go cache: setup-go's built-in cache is exact-match on
      # go.sum and usually saved by CI test jobs (host-platform builds only);
      # this one falls back on a restore-keys prefix and is saved at job end —
      # after goreleaser — so it warms every cross-compiled GOOS/GOARCH target.
      - name: Restore release Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-release-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-release-${{ runner.os }}-
      # cosign v3 here, writing the .sigstore.json bundle format. The image job
      # keeps the installer major the composite action ships to users.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT with contents:write on blairham/homebrew-tap, so the formula can
          # be committed to that separate repo.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Apple Developer ID signing + notarization of the darwin binaries.
          # The notarize block in .goreleaser.yaml self-disables when
          # MACOS_SIGN_P12 is unset, so releases still work without these.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      # SLSA build provenance for every archive checksums.txt lists. GitHub
      # stores it (`gh attestation verify`), and the bundle is also attached to
      # the release as stevedore-<tag>.intoto.jsonl, so it can be checked
      # offline and is found by tools that look for an .intoto.jsonl beside the
      # artifacts. The image carries its own provenance from the dogfood
      # release above.
      #
      # A SHA-pinned step here rather than slsa-github-generator's reusable
      # workflow, which verifies its own ref and so can only be tag-pinned.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Attach the provenance to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "$RUNNER_TEMP/stevedore-$TAG.intoto.jsonl"
          gh release upload "$TAG" "$RUNNER_TEMP/stevedore-$TAG.intoto.jsonl" --clobber

  # Repoint the moving major and minor tags (v1, v1.0) at this release, so
  # `uses: blairham/stevedore@v1` — the form the README documents and the form
  # Actions users expect — actually resolves.
  #
  # Gated on both artifact jobs: a moving tag pointing at a release that failed
  # halfway is worse than one that does not exist, because it resolves.
  moving-tags:
    needs: [image, binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag list, to decide whether this is the newest

      - name: Repoint moving tags
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # A prerelease never moves a floating pointer: `@v1` has to mean the
          # newest release we told people to run, not the newest rc.
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not a plain semver tag; moving tags untouched"
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          minor="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          # Only ever move forward. Re-running this workflow for an older patch
          # release must not drag `@v1` backwards onto it.
          newest=$(git tag --list "${major}.*.*" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1 || true)
          if [ -n "$newest" ] && [ "$newest" != "$TAG" ]; then
            echo "::notice::$newest is newer than $TAG; leaving $major and $minor where they are"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for t in "$major" "$minor"; do
            # Read the remote's current value *before* overwriting the local
            # tag, so the lease below is a real expectation rather than a
            # restatement of what we just did locally. Empty means "must not
            # exist yet", which is the first-v1 case.
            old=$(git ls-remote --tags origin "refs/tags/$t" | cut -f1)
            git tag -f -a "$t" -m "$t -> $TAG"
            # A lease rather than a bare force: if a concurrent release already
            # moved the pointer, fail loudly instead of dragging it backwards.
            git push --force-with-lease="refs/tags/$t:${old}" origin "refs/tags/$t"
            echo "==> $t -> $TAG"
          done

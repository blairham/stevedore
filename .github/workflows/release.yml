name: Release

# On a version tag: stevedore releases its own multi-arch image (signed + SBOM +
# provenance) by dogfooding itself, while blairham/.github's go-release.yml
# runs GoReleaser for the CLI binary, the GitHub release and the Homebrew
# formula, signs checksums.txt with keyless cosign and attests build
# provenance. Two tools, two artifact kinds. The binaries' signing identity is
# go-release.yml itself; the image's is still this workflow. SECURITY.md
# shows how to verify both.
on:
  push:
    tags: ["v*"]
  # Re-run a release for a tag that already exists — after a failed publish,
  # say — without moving or re-creating the tag; or, with dry-run, prove the
  # GoReleaser configuration without publishing anything.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.2). Must already exist. Leave empty for a dry run."
        required: false
        type: string
      dry-run:
        description: "Build the binaries with GoReleaser --snapshot; publish, sign and attest nothing, and skip the image."
        required: false
        type: boolean
        default: false

# Read-only by default; each job asks for exactly what it writes.
permissions:
  contents: read

jobs:
  # A release that publishes before its tests run ships whatever the tag
  # points at. The image waits on this; go-release.yml runs the same tests
  # before GoReleaser publishes anything.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go test -race ./...

  # Tags from before CHANGELOG.md existed (v1.0.6 and older, re-run by
  # dispatch) keep GoReleaser's generated notes; every later tag must have its
  # CHANGELOG.md section, and go-release.yml fails one that does not.
  notes:
    name: Release notes source
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: mode
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "mode=changelog" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG predates CHANGELOG.md; using GoReleaser's generated notes"
            echo "mode=generated" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: Image
    needs: test
    # A dry run proves the binary build; the image job has no dry mode that
    # pushes nothing, signs nothing and still exercises this path.
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # tags + history for versioning and changelog

      # The toolchain go.mod pins, not "stable": the released binary must be
      # the one CI tested, not whatever Go shipped this morning.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # Pinned action, not `curl … | sh` of grype's `main` — this job holds
      # push and signing credentials.
      - name: Install grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      - name: Put grype on PATH
        env:
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        run: |
          echo "$(dirname "$GRYPE_CMD")" >> "$GITHUB_PATH"
          "$GRYPE_CMD" version

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build stevedore
        run: go build -o /usr/local/bin/stevedore .

      # `latest` follows the same rule as the moving git tags below: only a
      # plain semver tag that is the newest one moves it. .stevedore.yaml tags
      # `latest` unconditionally, so for any other tag — a prerelease, or an
      # older release re-run by dispatch — release from a copy of the config
      # without that line. The copy lives outside the checkout, so the tree
      # stays clean; build paths resolve against --dir, not the config file.
      - name: Decide whether this release moves latest
        id: latest
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          config=.stevedore.yaml
          reason=""
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            reason="$TAG is not a plain semver tag"
          else
            newest=$(git tag --list 'v*.*.*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1 || true)
            if [ -n "$newest" ] && [ "$newest" != "$TAG" ]; then
              reason="$newest is newer than $TAG"
            fi
          fi
          if [ -n "$reason" ]; then
            config="$RUNNER_TEMP/stevedore.yaml"
            grep -vxF '      - "latest"' .stevedore.yaml > "$config" || true
            # Fail closed: if the line moved or changed spelling, the copy
            # would still tag latest, and that is the bug this step exists for.
            if [ "$(wc -l < .stevedore.yaml)" -ne $(( $(wc -l < "$config") + 1 )) ]; then
              echo "::error::could not remove exactly one '- \"latest\"' line from .stevedore.yaml"
              exit 1
            fi
            echo "::notice::$reason; not moving the image's latest tag"
          fi
          echo "config=$config" >> "$GITHUB_OUTPUT"

      - name: Release image (dogfood)
        env:
          CONFIG: ${{ steps.latest.outputs.config }}
        run: stevedore release --config "$CONFIG"

  # GoReleaser publishes the CLI binary, checksums, the GitHub release, and the
  # Homebrew formula (to blairham/homebrew-tap); go-release.yml signs
  # checksums.txt and attaches the provenance as stevedore-<tag>.intoto.jsonl.
  release:
    name: Release
    needs: notes
    permissions:
      contents: write # the GitHub release and its assets
      # Keyless cosign over checksums.txt and the provenance attestation both
      # sign with the workflow's OIDC identity — see `signs` in .goreleaser.yaml.
      id-token: write
      attestations: write # store the provenance in the repository's attestations
    uses: blairham/.github/.github/workflows/go-release.yml@9711060ad4860f35860bcbf90d90f103617082d2 # v0.0.1
    with:
      tag: ${{ inputs.tag }}
      snapshot: ${{ inputs.dry-run == true }}
      release-notes: ${{ needs.notes.outputs.mode }}
    secrets:
      # A PAT with contents:write on blairham/homebrew-tap, so the formula can
      # be committed to that separate repo.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Apple Developer ID signing + notarization of the darwin binaries. The
      # notarize block in .goreleaser.yaml self-disables when MACOS_SIGN_P12 is
      # unset, so releases still work without these.
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

  # Repoint the moving major and minor tags (v1, v1.0) at this release, so
  # `uses: blairham/stevedore@v1` — the form the README documents and the form
  # Actions users expect — actually resolves.
  #
  # Gated on both artifact jobs: a moving tag pointing at a release that failed
  # halfway is worse than one that does not exist, because it resolves.
  moving-tags:
    needs: [image, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # every tag: the newest-release check, and $TAG itself

      - name: Repoint moving tags
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # A prerelease never moves a floating pointer: `@v1` has to mean the
          # newest release we told people to run, not the newest rc.
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not a plain semver tag; moving tags untouched"
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          minor="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          # Only ever move forward. Re-running this workflow for an older patch
          # release must not drag `@v1` backwards onto it.
          newest=$(git tag --list "${major}.*.*" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1 || true)
          if [ -n "$newest" ] && [ "$newest" != "$TAG" ]; then
            echo "::notice::$newest is newer than $TAG; leaving $major and $minor where they are"
            exit 0
          fi

          # Point at the release's commit by name, never at HEAD. On
          # workflow_dispatch HEAD is whatever the dispatch ran from (normally
          # main), and the forward-only check above passes for the latest tag,
          # so tagging HEAD would move `@v1` onto unreleased code. The checkout
          # ref above makes HEAD the tag too; this does not rely on it.
          target=$(git rev-parse --verify --end-of-options "refs/tags/${TAG}^{commit}")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for t in "$major" "$minor"; do
            # Read the remote's current value *before* overwriting the local
            # tag, so the lease below is a real expectation rather than a
            # restatement of what we just did locally. Empty means "must not
            # exist yet", which is the first-v1 case.
            old=$(git ls-remote --tags origin "refs/tags/$t" | cut -f1)
            git tag -f -a "$t" -m "$t -> $TAG" "$target"
            # A lease rather than a bare force: if a concurrent release already
            # moved the pointer, fail loudly instead of dragging it backwards.
            git push --force-with-lease="refs/tags/$t:${old}" origin "refs/tags/$t"
            echo "==> $t -> $TAG ($target)"
          done

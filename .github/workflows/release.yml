name: release

# On a version tag: stevedore releases its own multi-arch image (signed + SBOM +
# provenance) by dogfooding itself, while GoReleaser publishes the CLI binary,
# the GitHub release, and the Homebrew cask. Two tools, two artifact kinds.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release / upload assets
  packages: write # push to ghcr.io
  id-token: write # keyless cosign signing via OIDC

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags + history for versioning and changelog

      - uses: actions/setup-go@v6
        with:
          go-version: "stable"
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: Install grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build stevedore
        run: go build -o /usr/local/bin/stevedore .

      - name: Release image (dogfood)
        run: stevedore release

  # GoReleaser publishes the CLI binary, checksums, the GitHub release, and the
  # Homebrew cask (to blairham/homebrew-tap).
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache: false # replaced by the release-scoped cache below
      # Release-scoped Go cache: setup-go's built-in cache is exact-match on
      # go.sum and usually saved by CI test jobs (host-platform builds only);
      # this one falls back on a restore-keys prefix and is saved at job end —
      # after goreleaser — so it warms every cross-compiled GOOS/GOARCH target.
      - name: Restore release Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-release-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-release-${{ runner.os }}-
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT with contents:write on blairham/homebrew-tap, so the cask can
          # be committed to that separate repo.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Apple Developer ID signing + notarization of the darwin binaries.
          # The notarize block in .goreleaser.yaml self-disables when
          # MACOS_SIGN_P12 is unset, so releases still work without these.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

# TEMPORARY probe for issue 133 — removed before merge.
name: zz-matrix-probe
on: pull_request
permissions: {}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      allbuilt: ${{ steps.p.outputs.allbuilt }}
      someskipped: ${{ steps.p.outputs.someskipped }}
      nothing: ${{ steps.p.outputs.nothing }}
    steps:
      - id: p
        run: |
          echo 'allbuilt={"include":[{"group":"a","ids":["a"],"only":"a","versions":{"a":"1.0.0"},"pins":"--pin-version a=1.0.0","reason":"r"},{"group":"b","ids":["b"],"only":"b","versions":{"b":"2.0.0"},"pins":"--pin-version b=2.0.0","reason":"r"}],"skipped":[]}' >> "$GITHUB_OUTPUT"
          echo 'someskipped={"include":[{"group":"a","ids":["a"],"only":"a","versions":{"a":"1.0.0"},"pins":"--pin-version a=1.0.0","reason":"r"},{"group":"b","ids":["b"],"only":"b","versions":{"b":"2.0.0"},"pins":"--pin-version b=2.0.0","reason":"r"}],"skipped":[{"id":"c","reason":"unchanged"},{"id":"d","reason":"unchanged"},{"id":"e","reason":"unchanged"}]}' >> "$GITHUB_OUTPUT"
          echo 'nothing={"include":[],"skipped":[{"id":"c","reason":"unchanged"}]}' >> "$GITHUB_OUTPUT"

  whole-allbuilt:
    needs: plan
    if: ${{ fromJson(needs.plan.outputs.allbuilt).include[0] != null }}
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.allbuilt) }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'only=${{ matrix.only }} skipped=${{ toJson(matrix.skipped) }}'
  whole-someskipped:
    needs: plan
    if: ${{ fromJson(needs.plan.outputs.someskipped).include[0] != null }}
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.someskipped) }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'only=${{ matrix.only }} skipped=${{ toJson(matrix.skipped) }}'
  whole-nothing:
    needs: plan
    if: ${{ fromJson(needs.plan.outputs.nothing).include[0] != null }}
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.nothing) }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'only=${{ matrix.only }}'

  incl-allbuilt:
    needs: plan
    if: ${{ fromJson(needs.plan.outputs.allbuilt).include[0] != null }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.plan.outputs.allbuilt).include }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'only=${{ matrix.only }}'
  incl-someskipped:
    needs: plan
    if: ${{ fromJson(needs.plan.outputs.someskipped).include[0] != null }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.plan.outputs.someskipped).include }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'only=${{ matrix.only }}'
  incl-nothing:
    needs: plan
    if: ${{ fromJson(needs.plan.outputs.nothing).include[0] != null }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.plan.outputs.nothing).include }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'only=${{ matrix.only }}'
  incl-nothing-unguarded:
    needs: plan
    strategy:
      matrix:
        include: ${{ fromJson(needs.plan.outputs.nothing).include }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'only=${{ matrix.only }}'

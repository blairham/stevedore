name: CI

# Everything that gates a merge. The shared jobs — Pre-commit, Detect changed
# files, Build and test, Fuzz — are blairham/.github's go-ci.yml, shared with
# every Go repository there; their checks report as `CI / <job>`. The image
# build is go-image.yml (`Image / Build image`). What is stevedore's own —
# the composite action and the example configs — is below, `needs: ci`, with
# its steps gated on `needs.ci.outputs.code == 'true'` (never a job-level
# `if:` or a `paths:` filter: a required check that never runs is pending
# forever).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    # A squash merge lands a tree no pull request ever built — the branch was
    # tested before the squash, and `main` may have moved under it since — so
    # the merge result gets its own run rather than inheriting the branch's
    # green tick.
    branches: [main]
  schedule:
    # Weekly, for go-ci.yml's Fuzz job, which explores on main and on this
    # schedule but never on a pull request.
    - cron: '41 5 * * 3'

permissions:
  contents: read

concurrency:
  # A superseded push is not worth finishing; only the newest commit matters.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: blairham/.github/.github/workflows/go-ci.yml@99060d62d0693570a360127ab698307d276630da # v0.0.0

  # The image is released by the dogfood job on a tag, so a Dockerfile that
  # stopped building would first fail after the tag was public. Build only,
  # for both release platforms; nothing is pushed.
  image:
    name: Image
    needs: ci
    uses: blairham/.github/.github/workflows/go-image.yml@99060d62d0693570a360127ab698307d276630da # v0.0.0
    with:
      run: ${{ needs.ci.outputs.code == 'true' }}
      platforms: linux/amd64,linux/arm64

  action-smoke:
    # Exercises the composite action end to end against the CURRENT checkout:
    # build stevedore, put it on PATH, then let the action install the tooling
    # and run `check` (install-stevedore: false so it uses our fresh binary).
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.ci.outputs.code == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.ci.outputs.code == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build stevedore from checkout
        if: needs.ci.outputs.code == 'true'
        run: |
          go build -o /usr/local/bin/stevedore .
      - name: Run stevedore via the action
        if: needs.ci.outputs.code == 'true'
        uses: ./
        with:
          install-stevedore: "false"
          command: check
          install-crane: "false"
      # The download path, which the step above skips: the action fetches the
      # newest release, verifies its checksums.txt signature against the
      # release workflow identity, and checks the archive against it. `help`
      # needs no config, so a config field newer than that release cannot
      # fail this for an unrelated reason.
      - name: Install a release via the action (verified download)
        if: needs.ci.outputs.code == 'true'
        uses: ./
        with:
          command: help
          install-cosign: "false" # installed anyway: the download needs it
          setup-buildx: "false"
          install-syft: "false"
          install-grype: "false"
      - name: The verified release is what is on PATH
        if: needs.ci.outputs.code == 'true'
        run: |
          set -euo pipefail
          got=$(command -v stevedore)
          echo "stevedore on PATH: $got"
          test "$got" = "$RUNNER_TEMP/stevedore-bin/stevedore"
          command -v cosign

  examples:
    # The examples are documentation people copy, so they are checked like code:
    # each one is resolved by the real binary in a scratch repo shaped the way
    # its config expects. A stale example is worse than no example, because it
    # is copied before it is read.
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.ci.outputs.code == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.ci.outputs.code == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build stevedore from checkout
        if: needs.ci.outputs.code == 'true'
        run: go build -o /usr/local/bin/stevedore .
      - name: Check every example config
        if: needs.ci.outputs.code == 'true'
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          cd "$scratch"
          git init -q -b main
          git config user.email ci@example.com
          git config user.name ci
          # The Dockerfiles the example configs reference.
          mkdir -p services/api services/worker
          touch Dockerfile services/api/Dockerfile services/worker/Dockerfile
          git add -A && git commit -qm init && git tag v1.0.0
          for cfg in "$GITHUB_WORKSPACE"/examples/*/.stevedore.yaml; do
            echo "::group::$(basename "$(dirname "$cfg")")"
            cp "$cfg" .stevedore.yaml
            stevedore check
            echo "::endgroup::"
          done
      - name: Lint the example workflow
        if: needs.ci.outputs.code == 'true'
        run: |
          # It is a workflow people paste into .github/workflows, so it has to
          # parse as one — it lives outside that directory precisely so GitHub
          # does not try to run it here.
          python3 -c "import yaml,sys; yaml.safe_load(open('examples/split-multiarch/release.yml'))"
      - name: No matrix built from the whole plan document
        if: needs.ci.outputs.code == 'true'
        run: |
          # A matrix built from the whole plan document makes its `skipped`
          # list a matrix dimension: GitHub rejects it when empty and, when
          # not, runs one job per skipped image carrying only the last include
          # entry. The documented form takes `.include` alone. (No expression
          # syntax in this script: Actions would evaluate it.)
          if grep -rnE '^[[:space:]]*matrix:[[:space:]]*\$\{\{[[:space:]]*fromJson\([^)]*\)[[:space:]]*\}\}' \
              README.md action.yml docs examples; then
            echo "::error::build the matrix from the plan's include list (matrix.include = fromJson(plan).include), not the whole plan document"
            exit 1
          fi

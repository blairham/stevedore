name: CI

# One workflow holds everything that gates a merge, so there is one file to
# read and one check to require. Splitting pre-commit or tests into their own
# workflow bought nothing and cost a second place to keep in sync.
on:
  pull_request:
    # `synchronize` is every push to a branch with an open pull request, which
    # is the feedback that matters. A draft is treated exactly like any other
    # pull request: the distinction bought a little runner time and cost a
    # second set of rules to hold in your head.
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    # Everything runs here too, not just pre-commit. A squash merge lands a
    # tree no pull request ever built — the branch was tested before the
    # squash, and `main` may have moved under it since — so the merge result
    # gets its own run rather than inheriting the branch's green tick.
    branches: [main]

permissions:
  contents: read

concurrency:
  # A superseded push to a pull request is not worth finishing. A push to main
  # is: it is the record of whether that merge was good, and cancelling it
  # leaves the question unanswered.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs for every commit that reaches GitHub — every push to a pull request,
  # draft or not, and every push to main. It is the only job that looks at
  # *every* file rather than at Go: trailing whitespace, licence headers,
  # secrets, the toolchain pin. None of that is worth detecting changes for,
  # and a secret committed to a draft is committed.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        check-latest: true
        cache: true # go-mod-tidy-repo resolves the whole graph; uncached it is slow and flaky
    - name: Run pre-commit hooks
      # Nothing is skipped: pre-commit is the linter. `golangci-lint` reports
      # what the change introduced, which is the whole point of running it
      # here rather than in a job of its own.
      uses: blairham/go-pre-commit@v4.6.6

  # Gating happens inside the jobs, never with a workflow-level `paths:`
  # filter: a required check that never runs reports as *pending forever*
  # rather than as passed, which makes a docs-only pull request unmergeable.
  # Anything unrecognised counts as code, so when this is wrong it is wrong in
  # the direction of running the tests.
  # Only after the cheap universal checks have passed is it worth asking the
  # expensive question, so this waits on pre-commit.
  changes:
    name: Detect changed files
    needs: pre-commit
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0 # the diff needs the base commit, not just HEAD
    - id: filter
      name: Is any of this code?
      env:
        # On a merge to main there is no pull request; `before` is the commit
        # main pointed at, which makes the diff the merge itself.
        BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      run: |
        code=false
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          # A merge runs everything. Not because the merge itself changed code
          # — it may be pure prose — but because this is the first time this
          # tree is tested *as main*, and what it protects against is an
          # earlier merge that broke something nobody has run since.
          echo "push to $GITHUB_REF_NAME — running everything"
          code=true
        elif ! git cat-file -e "$BASE" 2>/dev/null; then
          # No usable base commit — a force push, or a shallow fetch that did
          # not reach it. `git diff` would fail here and print nothing, and an
          # empty diff is indistinguishable from "only prose changed", so this
          # would silently skip every test. The safe answer is to run them.
          echo "base commit $BASE is not present — running everything"
          code=true
        else
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/*|*.md|LICENSE|LICENSE.*|*.png|*.jpg|*.gif|*.svg) ;; # prose
              *) code=true; break ;;
            esac
          done <<<"$(git diff --name-only "$BASE"...HEAD)"
        fi
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "changed files are $([ "$code" = true ] && echo 'code — full run' || echo 'prose only — skipping the code jobs')"

  test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        check-latest: true
        cache: true
    - run: go test -race ./...
    - run: go build ./...


  action-smoke:
    # Exercises the composite action end to end against the CURRENT checkout:
    # build stevedore, put it on PATH, then let the action install the tooling
    # and run `check` (install-stevedore: false so it uses our fresh binary).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build stevedore from checkout
        run: |
          go build -o /usr/local/bin/stevedore .
      - name: Run stevedore via the action
        uses: ./
        with:
          install-stevedore: "false"
          command: check
          install-crane: "false"

  examples:
    # The examples are documentation people copy, so they are checked like code:
    # each one is resolved by the real binary in a scratch repo shaped the way
    # its config expects. A stale example is worse than no example, because it
    # is copied before it is read.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build stevedore from checkout
        run: go build -o /usr/local/bin/stevedore .
      - name: Check every example config
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          cd "$scratch"
          git init -q -b main
          git config user.email ci@example.com
          git config user.name ci
          # The Dockerfiles the example configs reference.
          mkdir -p services/api services/worker
          touch Dockerfile services/api/Dockerfile services/worker/Dockerfile
          git add -A && git commit -qm init && git tag v1.0.0
          for cfg in "$GITHUB_WORKSPACE"/examples/*/.stevedore.yaml; do
            echo "::group::$(basename "$(dirname "$cfg")")"
            cp "$cfg" .stevedore.yaml
            stevedore check
            echo "::endgroup::"
          done
      - name: Lint the example workflow
        run: |
          # It is a workflow people paste into .github/workflows, so it has to
          # parse as one — it lives outside that directory precisely so GitHub
          # does not try to run it here.
          python3 -c "import yaml,sys; yaml.safe_load(open('examples/split-multiarch/release.yml'))"

  # The one check branch protection requires. Requiring the jobs by name does
  # not survive this workflow's shape: a job skipped by the prose guard never
  # reports, and a *matrix* job skipped by `if:` never expands, so a policy
  # naming "test (ubuntu-latest)" waits for it forever. A single always-running
  # gate that fails when any upstream job failed survives skips, matrix
  # renames and new jobs alike — when jobs change here, update this `needs`
  # list and nothing else.
  ci-ok:
    needs: [pre-commit, changes, test, action-smoke, examples]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Verify no required job failed
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        echo "$RESULTS"
        bad=$(echo "$RESULTS" | jq -r 'to_entries[]
          | select(.value.result != "success" and .value.result != "skipped")
          | "\(.key)=\(.value.result)"')
        if [ -n "$bad" ]; then
          echo "not ok: $bad"
          exit 1
        fi
        echo "ok"

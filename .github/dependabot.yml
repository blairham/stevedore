# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
  # Covers the workflows and the composite action.yml at the root, which is
  # what `uses: blairham/stevedore@v1` runs in other people's pipelines.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The builder tracks the Go line pinned in go.mod (1.26.x). A new Go
      # minor (1.26 -> 1.27) moves go.mod, .tool-versions and every sibling
      # repo together, by hand — not as a lone Dockerfile bump. Digest and
      # patch updates still come through.
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

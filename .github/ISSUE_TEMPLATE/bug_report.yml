name: Bug report
description: Something stevedore did that it should not have
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The single most useful thing you can include is
        the output of `stevedore doctor` and a run with `--dry-run`, which prints
        every command stevedore would execute without executing any of them.
  - type: input
    id: version
    attributes:
      label: stevedore version
      description: "`stevedore --version`"
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How are you running it?
      options:
        - GitHub Action (blairham/stevedore@vN)
        - CLI in CI (other provider)
        - CLI locally
        - The released container image
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant part of your .stevedore.yaml
      description: Redact registries and account IDs if you need to; keep the structure.
      render: yaml
  - type: textarea
    id: output
    attributes:
      label: Output
      description: "Ideally from `--dry-run`, or the failing run with `--verbose`."
      render: shell
  - type: textarea
    id: doctor
    attributes:
      label: stevedore doctor
      description: Which external tools are present and at what versions.
      render: shell

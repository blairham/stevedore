name: Feature request
description: Something stevedore should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        stevedore's design principle is **orchestrate, don't reimplement** — it
        shells out to `docker buildx`, `cosign`, `syft`, `grype`, `crane`, `aws`
        and `gh` rather than embedding them. Requests that add a pipeline stage,
        an importer, a version strategy or a registry fit well. Requests to
        reimplement in Go something an existing tool already does are the ones
        likely to be turned down, so if that is what you are asking for, it is
        worth saying why the existing tool is not enough.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The pipeline you are building, not the feature you have in mind for it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?
      description: Even "a pile of shell in a workflow" is useful — paste it.
  - type: textarea
    id: idea
    attributes:
      label: What would it look like in .stevedore.yaml?
      render: yaml

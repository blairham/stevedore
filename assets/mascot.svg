<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Stevedore mascot: a dock worker in a red knit cap carrying a shipping container">
  <defs>
    <clipPath id="badge"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="512" height="512" fill="#0E2A3E"/>

    <!-- harbour, behind the pier -->
    <path d="M-40 470 q36 -18 72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 v90 h-576 z" fill="#164A69"/>
    <path d="M-40 496 q36 -16 72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 v60 h-576 z" fill="#1E5F84"/>

    <g stroke="#3A2418" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <!-- torso and ears go behind the head, so its outline stays whole -->
      <rect x="210" y="198" width="92" height="64" rx="22" fill="#2F6FA8"/>

      <circle cx="196" cy="164" r="12" fill="#EBB78C"/>
      <circle cx="316" cy="164" r="12" fill="#EBB78C"/>

      <!-- head -->
      <circle cx="256" cy="152" r="62" fill="#F3C69E"/>

      <!-- knit cap -->
      <path d="M194 134 a62 62 0 0 1 124 0 z" fill="#D64A3F"/>
      <rect x="188" y="120" width="136" height="30" rx="15" fill="#B93A31"/>
      <circle cx="256" cy="70" r="18" fill="#F0E6D8"/>

      <!-- pier -->
      <rect x="-20" y="404" width="552" height="44" rx="6" fill="#7A5638"/>
      <g stroke="#5C3F28" stroke-width="6">
        <path d="M60 404 V448"/><path d="M180 404 V448"/><path d="M332 404 V448"/><path d="M452 404 V448"/>
      </g>

      <!-- shipping container -->
      <rect x="116" y="248" width="280" height="158" rx="14" fill="#E9873C"/>
      <g stroke="#C96C26" stroke-width="9">
        <path d="M150 278 V376"/><path d="M180 278 V376"/><path d="M210 278 V376"/><path d="M240 278 V376"/>
        <path d="M272 278 V376"/><path d="M302 278 V376"/><path d="M332 278 V376"/><path d="M362 278 V376"/>
      </g>
      <rect x="108" y="240" width="296" height="30" rx="13" fill="#B95E1F"/>
      <rect x="108" y="382" width="296" height="26" rx="11" fill="#B95E1F"/>

      <!-- hands on the rail; the arms are read, not drawn -->
      <circle cx="124" cy="252" r="27" fill="#F3C69E"/>
      <circle cx="388" cy="252" r="27" fill="#F3C69E"/>
    </g>

    <!-- face -->
    <circle cx="233" cy="166" r="8" fill="#23303A"/>
    <circle cx="279" cy="166" r="8" fill="#23303A"/>
    <circle cx="236.5" cy="163" r="2.7" fill="#FFFFFF"/>
    <circle cx="282.5" cy="163" r="2.7" fill="#FFFFFF"/>
    <path d="M256 174 q9 12 -3 15" stroke="#D9A57C" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <path d="M256 194 q-15 -10 -30 -2 q-13 7 -6 17 q9 12 21 3 q10 -7 15 -12 q5 5 15 12 q12 9 21 -3 q7 -10 -6 -17 q-15 -8 -30 2 z" fill="#4A3222"/>
    <path d="M215 139 q12 -8 26 -2" stroke="#4A3222" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M297 139 q-12 -8 -26 -2" stroke="#4A3222" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>
</svg>

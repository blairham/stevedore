# The common case: one service, one Dockerfile, signed and attested releases.
#
#   stevedore check                      # resolve and validate, publish nothing
#   stevedore release --snapshot --dry-run
#   git tag v1.0.0 && stevedore release
version: 1

project_name: myapp

images:
  - id: myapp
    dockerfile: Dockerfile
    context: .
    platforms:
      - linux/amd64
      - linux/arm64
    repositories:
      - ghcr.io/acme/myapp
    tags:
      # Immutable, always published.
      - "{{ .Version }}"
      - "{{ .ShortCommit }}"
      # Floating: publishes only on the default branch of a real release, so a
      # feature branch, a --snapshot or a release candidate (v1.1.0-rc.1) can
      # never move what production pulls. 1.0 and 1 follow the newest patch
      # and minor.
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
      - "latest"
    build_args:
      - "VERSION={{ .Version }}"
    labels:
      # Set image.source and ghcr links the package to the repo, which is also
      # what makes the package public alongside a public repo.
      org.opencontainers.image.source: "https://github.com/acme/myapp"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .Commit }}"

# The gates run before signing and tagging, so a failing image is never signed
# or tagged.
scan:
  enabled: true
  scanner: grype
  fail_on: high

test:
  enabled: true
  cmd: ["/usr/bin/myapp", "--version"]
  expect_exit: 0

sign:
  cosign:
    enabled: true # keyless: no `key:` means OIDC, which needs id-token: write

sbom:
  enabled: true
  attest: true

provenance:
  enabled: true
  mode: max

# A real release refuses --skip-scan/--skip-test/--skip-sign/--skip-sbom, and
# refuses any of these stages being disabled above. Snapshots are exempt.
policy:
  require: [scan, test, sign, sbom]

changelog:
  enabled: true

# GoReleaser builds and publishes the stevedore CLI binary and its Homebrew
# cask. (stevedore itself releases the container image — see .stevedore.yaml.)
version: 2

project_name: stevedore

before:
  hooks:
    - go mod tidy

builds:
  - id: stevedore
    main: .
    binary: stevedore
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: stevedore
    # uname-style naming (Darwin_x86_64, Linux_arm64) to match the other tools
    # already in the tap.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - repository:
      owner: blairham
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/blairham/stevedore"
    description: "Release Docker/OCI images the way goreleaser releases binaries"
    license: "MIT"
    hooks:
      post:
        # Drop the download's quarantine flag, then ad-hoc sign ONLY if the
        # binary has no valid signature already. The guard matters: once the
        # notarize block is live, `codesign --force` would replace a real
        # Developer ID signature with an ad-hoc one and undo the notarization.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/stevedore"]
            if system_command("/usr/bin/codesign", args: ["-v", "#{staged_path}/stevedore"]).exit_status != 0
              system_command "/usr/bin/codesign", args: ["--force", "--sign", "-", "#{staged_path}/stevedore"]
            end
          end

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - stevedore
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true

release:
  github:
    owner: blairham
    name: stevedore
  # GoReleaser owns the GitHub release (binaries, checksums, notes). stevedore's
  # own release.github is disabled so the two don't collide.

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"

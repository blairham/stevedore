# GoReleaser builds and publishes the stevedore CLI binary and its Homebrew
# cask. (stevedore itself releases the container image — see .stevedore.yaml.)
version: 2

project_name: stevedore

before:
  hooks:
    - go mod tidy

builds:
  - id: stevedore
    main: .
    binary: stevedore
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: stevedore
    # uname-style naming (Darwin_x86_64, Linux_arm64) to match the other tools
    # already in the tap.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

# A formula, not a cask. stevedore is a CLI binary with no bundle, no installer
# and no service; `brew test` is worth keeping, and formulae work on Homebrew
# for Linux exactly as they do on macOS.
#
# GoReleaser marks `brews` deprecated in favour of `homebrew_casks`, on the
# grounds that formulae installing pre-compiled binaries are "hackyish" and
# were only needed because Linuxbrew could not handle casks. There is no
# announced removal date, and the Linuxbrew limitation is not our reason for
# using them.
#
# Note there is no quarantine hook here: casks flag their downloads with
# com.apple.quarantine and need it stripped, formulae do not.
brews:
  - name: stevedore
    repository:
      owner: blairham
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/blairham/stevedore"
    description: "Release Docker/OCI images the way goreleaser releases binaries"
    license: "MIT"
    install: |
      bin.install "stevedore"
    test: |
      system "#{bin}/stevedore", "--version"

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - stevedore
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true

release:
  github:
    owner: blairham
    name: stevedore
  # GoReleaser owns the GitHub release (binaries, checksums, notes). stevedore's
  # own release.github is disabled so the two don't collide.

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
